let activeFilter = null;
let searchTerm = '';
let sortMode = 'issues';

// Build category chips
const summaryBar = document.getElementById('summaryBar');
const labelEl = summaryBar.querySelector('label');

CATS.forEach((cat, i) => {
  const chip = document.createElement('span');
  chip.className = `cat-chip chip${i}`;
  chip.dataset.cat = cat;
  chip.innerHTML = `${cat} <span>${COUNTS[cat] || 0}</span>`;
  chip.addEventListener('click', () => {
    if (activeFilter === cat) {
      activeFilter = null;
      chip.classList.remove('active');
    } else {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      activeFilter = cat;
      chip.classList.add('active');
    }
    render();
  });
  summaryBar.appendChild(chip);
});

const clearBtn = document.createElement('span');
clearBtn.textContent = '✕ Clear';
clearBtn.style.cssText = 'cursor:pointer;font-size:12px;color:#888;padding:5px 10px;';
clearBtn.addEventListener('click', () => {
  activeFilter = null;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  render();
});
summaryBar.appendChild(clearBtn);

document.getElementById('searchBox').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  render();
});

document.getElementById('sortSelect').addEventListener('change', e => {
  sortMode = e.target.value;
  render();
});

function catIndex(cat) { return CATS.indexOf(cat); }

function render() {
  let data = RAW.filter(item => {
    if (activeFilter && !item.issues[activeFilter]) return false;
    if (searchTerm && !item.clinic.toLowerCase().includes(searchTerm) && !item.email.toLowerCase().includes(searchTerm)) return false;
    return true;
  });

  if (sortMode === 'issues') {
    data = data.sort((a, b) => Object.keys(b.issues).length - Object.keys(a.issues).length);
  } else {
    data = data.sort((a, b) => a.clinic.localeCompare(b.clinic));
  }

  document.getElementById('visibleCount').textContent = `${data.length} clinics`;
  document.getElementById('resultCount').textContent = `Showing ${data.length} clinics`;

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  data.forEach(item => {
    const issueCats = Object.keys(item.issues);
    const snippets = activeFilter
      ? (item.issues[activeFilter] || [])
      : issueCats.flatMap(c => (item.issues[c] || []).slice(0,1));

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="clinic-name">${item.clinic}</div>
        <div class="clinic-email">${item.email || '—'}</div>
      </td>
      <td>
        <div class="cat-tags">
          ${issueCats.map(c => `<span class="tag c${catIndex(c)}">${c}</span>`).join('')}
        </div>
        ${snippets.map(s => `<div class="snippet">${escHtml(s)}</div>`).join('')}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();
</script>
