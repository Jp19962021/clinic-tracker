<html lang="en">
<head>
<meta charset="UTF-8">

<title>PetScript — Clinic Issue Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

  header { background: #004B8D; color: white; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header p { font-size: 13px; opacity: 0.75; margin-top: 2px; }
  .badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }

  .filter-section { background: white; border-bottom: 1px solid #e0e4ea; padding: 14px 28px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .summary-bar { background: #f8f9fb; border-bottom: 1px solid #e0e4ea; padding: 12px 28px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cat-chip { border-radius: 20px; padding: 5px 13px; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
  .cat-chip.active { border-color: #004B8D; box-shadow: 0 0 0 1px #004B8D; }
  .cat-chip span { display: inline-block; background: rgba(0,0,0,0.13); border-radius: 10px; padding: 0px 7px; font-size: 11px; margin-left: 4px; }

  .controls { background: white; border-bottom: 1px solid #e0e4ea; padding: 11px 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 180px; padding: 7px 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; outline: none; }
  .search-box:focus { border-color: #004B8D; box-shadow: 0 0 0 3px rgba(0,75,141,0.1); }
  select, input[type=date] { padding: 7px 11px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer; background: white; }
  select:focus, input[type=date]:focus { border-color: #004B8D; }
  label { font-size: 12px; color: #666; font-weight: 600; white-space: nowrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .divider { width: 1px; height: 24px; background: #e0e4ea; margin: 0 4px; }

  .custom-date { display: none; align-items: center; gap: 6px; }
  .custom-date.visible { display: flex; }

  .result-count { padding: 7px 28px; font-size: 12px; color: #888; background: #f8f9fb; border-bottom: 1px solid #e0e4ea; }

  .table-wrap { padding: 20px 28px 40px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 13px; }
  thead tr { background: #f8f9fb; }
  th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #666; border-bottom: 1px solid #e8ebef; }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f7f9fc; }

  .clinic-name { font-weight: 600; color: #004B8D; margin-bottom: 2px; }
  .clinic-meta { font-size: 11px; color: #999; margin-top: 2px; }

  .cat-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
  .tag { border-radius: 12px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }

  .snippet { font-size: 12px; color: #444; line-height: 1.5; padding: 5px 8px; background: #f8f9fb; border-left: 2px solid #d1d5db; border-radius: 0 4px 4px 0; margin-top: 4px; }

  .state-pill { display: inline-block; background: #e8edf2; color: #445; border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 600; margin-right: 6px; }
  .date-pill { display: inline-block; color: #888; font-size: 11px; }

  .no-results { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }

  .c3{background:#dbeafe;color:#1e3a8a} .c4{background:#ede9fe;color:#5b21b6} .c5{background:#e0f2fe;color:#075985}

  .chip0{background:#fef3c7;color:#92400e} .chip1{background:#fee2e2;color:#991b1b} .chip2{background:#fde8d8;color:#9a3412}
  .chip3{background:#dbeafe;color:#1e3a8a} .chip4{background:#ede9fe;color:#5b21b6} .chip5{background:#e0f2fe;color:#075985}
  .chip6{background:#d1fae5;color:#065f46} .chip7{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb} .chip8{background:#fce7f3;color:#831843}

<body>

<header>
  <div>
    <h1>PetScript — Clinic Issue Tracker</h1>
    <p>Customer notes review &middot; Flagged accounts by issue type</p>
  </div>
  <div class="badge" id="visibleCount">— clinics</div>
</header>

<div class="summary-bar" id="summaryBar">
  <label style="margin-right:2px;font-size:12px;color:#666;">Issue type:</label>
</div>

<div class="controls">
  <input class="search-box" type="text" id="searchBox" placeholder="Search clinic name or email…">

  <div class="divider"></div>

  <div class="filter-group">
    <label for="dateRange">Date:</label>
    <select id="dateRange">
      <option value="all">All time</option>
      <option value="week">Last 7 days</option>
      <option value="month">Last 30 days</option>
      <option value="quarter">Last quarter</option>
      <option value="year">Last year</option>
      <option value="custom">Custom range…</option>
    </select>
  </div>

  <div class="custom-date" id="customDate">
    <label>From</label>
    <input type="date" id="dateFrom">
    <label>To</label>
    <input type="date" id="dateTo">
  </div>

  <div class="divider"></div>

  <div class="filter-group">
    <label for="stateSelect">State:</label>
    <select id="stateSelect">
      <option value="">All states</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="filter-group">
    <label for="sortSelect">Sort:</label>
    <select id="sortSelect">
      <option value="date">Most recent</option>
      <option value="issues">Most issue types</option>
      <option value="alpha">A–Z</option>
    </select>
  </div>
</div>

<div class="result-count" id="resultCount"></div>

<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th style="width:220px">Clinic</th>
        <th>Issues</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

// populate state dropdown
const stateSelect = document.getElementById('stateSelect');
const allStates = [...new Set(RAW.map(x => x.state).filter(Boolean))].sort();
allStates.forEach(s => {
  const o = document.createElement('option');
  o.value = s; o.textContent = s;
  stateSelect.appendChild(o);
});

// build category chips with live counts
const summaryBar = document.getElementById('summaryBar');
let activeFilter = null;

function buildChips(data) {
  const counts = {};
  data.forEach(item => Object.keys(item.issues).forEach(c => counts[c] = (counts[c]||0)+1));
  document.querySelectorAll('.cat-chip').forEach(c => c.remove());
  CATS.forEach((cat, i) => {
    if (!counts[cat]) return;
    const chip = document.createElement('span');
    chip.className = `cat-chip chip${i}`;
    chip.dataset.cat = cat;
    chip.innerHTML = `${cat} <span>${counts[cat]}</span>`;
    chip.addEventListener('click', () => {
      if (activeFilter === cat) { activeFilter = null; chip.classList.remove('active'); }
      else { document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active')); activeFilter = cat; chip.classList.add('active'); }
      render();
    });
    summaryBar.appendChild(chip);
  });
  // restore active state
  if (activeFilter) {
    document.querySelectorAll('.cat-chip').forEach(c => { if(c.dataset.cat === activeFilter) c.classList.add('active'); });
  }
}

// date helpers
function today() { return new Date().toISOString().slice(0,10); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function quarterStart() {
  const d = new Date(); const q = Math.floor(d.getMonth()/3);
  return new Date(d.getFullYear(), q*3, 1).toISOString().slice(0,10);
}
function yearStart() { return new Date(new Date().getFullYear()-1, new Date().getMonth(), new Date().getDate()).toISOString().slice(0,10); }

function getDateRange() {
  const v = document.getElementById('dateRange').value;
  const t = today();
  if (v === 'all') return [null, null];
  if (v === 'week') return [daysAgo(7), t];
  if (v === 'month') return [daysAgo(30), t];
  if (v === 'quarter') return [quarterStart(), t];
  if (v === 'year') return [yearStart(), t];
  if (v === 'custom') return [document.getElementById('dateFrom').value || null, document.getElementById('dateTo').value || null];
  return [null, null];
}

document.getElementById('dateRange').addEventListener('change', e => {
  document.getElementById('customDate').classList.toggle('visible', e.target.value === 'custom');
  render();
});
document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);
document.getElementById('stateSelect').addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const state = document.getElementById('stateSelect').value;
  const sort = document.getElementById('sortSelect').value;
  const [dateFrom, dateTo] = getDateRange();

  let data = RAW.filter(item => {
    if (activeFilter && !item.issues[activeFilter]) return false;
    if (search && !item.clinic.toLowerCase().includes(search) && !item.email.toLowerCase().includes(search)) return false;
    if (state && item.state !== state) return false;
    if (dateFrom && item.date && item.date < dateFrom) return false;
    if (dateTo && item.date && item.date > dateTo) return false;
    return true;
  });

  buildChips(data);

  if (sort === 'date') data.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else if (sort === 'issues') data.sort((a,b) => Object.keys(b.issues).length - Object.keys(a.issues).length);
  else data.sort((a,b) => a.clinic.localeCompare(b.clinic));

  document.getElementById('visibleCount').textContent = `${data.length} clinics`;
  document.getElementById('resultCount').textContent = `${data.length} clinic${data.length !== 1 ? 's' : ''} matching current filters`;

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="2"><div class="no-results">No clinics match the current filters.</div></td></tr>`;
    return;
  }

  data.forEach(item => {
    const issueCats = Object.keys(item.issues);
    const snippets = activeFilter ? (item.issues[activeFilter]||[]) : issueCats.flatMap(c => (item.issues[c]||[]).slice(0,1));
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="clinic-name">${escHtml(item.clinic)}</div>
        <div class="clinic-meta">
          ${item.state ? `<span class="state-pill">${item.state}</span>` : ''}
          <span class="date-pill">${item.date ? item.date.replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$2/$3/$1') : ''}</span>
        </div>
        <div class="clinic-meta" style="margin-top:3px">${escHtml(item.email||'')}</div>
      </td>
      <td>
        <div class="cat-tags">${issueCats.map(c=>`<span class="tag c${CATS.indexOf(c)}">${c}</span>`).join('')}</div>
        ${snippets.map(s=>`<div class="snippet">${escHtml(s)}</div>`).join('')}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

render();
